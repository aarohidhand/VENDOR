[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtgen"
version = "1.0.0"
description = "Generation pipeline for the VENDOR negotiation-dialogue benchmark"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gtgen = "gtgen.cli:main"
